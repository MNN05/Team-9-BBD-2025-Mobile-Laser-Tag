<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player's View </title>
     <!-- Tailwind CSS CDN (okay for development, not production) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="styles/Player.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class=" game-container flex flex-col items-center justify-center min-h-screen p-4 bg-black text-white">
        <header>
            <h1 class="retro-heading text-4xl sm:text-5xl font-bold mb-8 text-cyan-400">Laser Tag Royale</h1>

            <div class="retro-heading">
                <p>Score: 0       Username:         Time Left: 01:00 </p>
            </div>
        </header>

        <div class="target-area">
           <!-- <video id="camera" autoplay playsinline></video>
            <canvas id="overlay"></canvas> -->
            <img src="images/Dummy-image.jpg" height="250px" width="200px">
        </div>

        <footer>
            <button id="shoot-btn" class="btn text-xl sm:text-2xl font-bold py-3 px-6 rounded-lg w-full max-w-xs transition transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-600 bg-indigo-700">Shoot!</button>
        

            <audio id="hit-sound" src="hit.mp3"></audio>
            <audio id="shoot-sound" src="shoot.mp3"></audio>
        </footer>
  </div>


    <!--Link to the scripts-->
    <script src="scripts/vision.js"></script>
    <script src= "scripts/playerState.js"></script>
    <script src="scripts/app.js"></script>
    <script src="scripts/feedback.js"></script>
    <script src="scripts/uiupdate.js"></script>
    <script src="scripts/CameraAccess.js"></script>
    <script src="scripts/DetectionTags.js"></script>

</body>
</html>
