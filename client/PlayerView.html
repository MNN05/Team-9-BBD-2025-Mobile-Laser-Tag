<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Laser Tag Player View</title>
  <link rel="stylesheet" href="styles/Player.css" />
</head>
<body>
  <div id="player-view">
    <!-- Top HUD -->
    <header id="hud" class="retro-heading text-4xl sm:text-5xl font-bold mb-8 text-cyan-400">
      <div id="team-red-score">TEAM RED'S SCORE: 0</div>
      <div id="timer">TIME LEFT: 01:00</div>
      <div id="team-blue-score">TEAM BLUE'S SCORE: 0</div>
    </header>

    <!-- Crosshair (Center Viewfinder) -->
    <div id="crosshair">
        <video src="images/Dummy-image.jpg"></video>
    </div>

    <!-- Shoot Button -->
    <button id="shoot-button" class="btn text-xl sm:text-2xl font-bold py-3 px-6 rounded-lg w-full max-w-xs transition transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-600 bg-indigo-700">SHOOT!</button>

    <!-- Footer Ribbon -->
    <footer id="bottom-ribbon">
      <div id="status-label"></div>
      <div id="team-label">YOUR TEAM: --</div>
    </footer>

    <!-- Sound Effects -->
    <audio id="sfx-hit" src="sounds/hit.mp3" preload="auto"></audio>
    <audio id="sfx-miss" src="sounds/miss.wav" preload="auto"></audio>
  </div>

  <!-- Game Logic -->
  <script src="scripts/game.js"></script>
</body>
</html>
